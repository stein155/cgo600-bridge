name: Web Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome==2026.10.0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 installer/local_esphome_config.py
          esphome -s project_version "$VERSION" compile esphome/.install-ci.yaml

      - name: Assemble installer site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 installer/build_site.py --version "$VERSION" --out site

      - name: Attach firmware to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          BUILD=esphome/.esphome/build/tenways-bridge/build
          cp "$BUILD/firmware.factory.bin" tenways-bridge-factory.bin
          cp "$BUILD/firmware.ota.bin" tenways-bridge-ota.bin
          sha256sum tenways-bridge-*.bin > SHA256SUMS
          gh release upload "$RELEASE_TAG" tenways-bridge-*.bin SHA256SUMS --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
