name: Build & Release Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.clang-format'
      - 'README.md'
      - 'RELEASE.md'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.clang-format'
      - 'README.md'
      - 'RELEASE.md'
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Style check only — informational for now (existing files are not yet
      # reformatted to .clang-format), so it must not fail the pipeline.
      - name: clang-format check
        continue-on-error: true
        run: |
          clang-format --version
          clang-format --dry-run --Werror firmware/src/*.cpp firmware/src/*.h

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: cd firmware && pio run

      - name: Build LittleFS image
        run: cd firmware && pio run -t buildfs

      - name: Rename artifacts
        run: |
          cp firmware/.pio/build/esp32/firmware.bin cgo600-firmware.bin
          cp firmware/.pio/build/esp32/littlefs.bin cgo600-littlefs.bin
          cp firmware/.pio/build/esp32/bootloader.bin cgo600-bootloader.bin
          cp firmware/.pio/build/esp32/partitions.bin cgo600-partitions.bin
          sha256sum cgo600-*.bin > SHA256SUMS
          cat > flash_args.txt <<'EOF'
          # ESP32 flash offsets for CGO600 Smart Bridge
          0x1000   cgo600-bootloader.bin
          0x8000   cgo600-partitions.bin
          0x10000  cgo600-firmware.bin
          0x3D0000 cgo600-littlefs.bin
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            cgo600-firmware.bin
            cgo600-littlefs.bin
            cgo600-bootloader.bin
            cgo600-partitions.bin
            SHA256SUMS
            flash_args.txt

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cgo600-firmware.bin
            cgo600-littlefs.bin
            cgo600-bootloader.bin
            cgo600-partitions.bin
            SHA256SUMS
            flash_args.txt
