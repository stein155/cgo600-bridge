[env:esp32]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    marvinroger/AsyncMqttClient@0.9.0
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DBLE_GAP_DEBUG=0
monitor_speed = 115200
